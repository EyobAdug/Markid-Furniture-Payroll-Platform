name: Build desktop apps
# Run manually (Actions tab -> Build desktop apps -> Run workflow) or push a tag like v2.0.0 to publish a Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac-AppleSilicon
          - os: macos-15-intel
            name: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - run: pyinstaller --noconfirm markid.spec
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/MarkidPayroll -DestinationPath MarkidPayroll-${{ matrix.name }}.zip
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Markid Payroll.app" MarkidPayroll-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MarkidPayroll-${{ matrix.name }}
          path: MarkidPayroll-${{ matrix.name }}.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MarkidPayroll-${{ matrix.name }}.zip
